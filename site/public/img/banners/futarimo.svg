<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 176" width="700" height="176" role="img" aria-labelledby="tf df" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="tf">ふたりも｜婚前契約書をふたりでつくる無料ツール</title>
  <desc id="df">オレタチの運営チームが自分たちで作った無料ツール、ふたりもの案内バナー。婚前契約書を、ふたりでつくる。質問にふたりで答えるだけで、ズレが見えて、下書きまでできる。登録不要、無料。内容はこの端末から外に出ない。ボタンはふたりもをひらく。右側に、橙と緑のふたつのキャラクターが並んで座っているイラスト。</desc>

  <rect x="0.5" y="0.5" width="699" height="175" rx="14" fill="#FBF9F4" stroke="#E4DACB"/>
  <image x="484" y="28" width="200" height="120" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>

  <text x="40" y="34" font-size="12" font-weight="700" fill="#B5481F">オレタチの運営チームが、自分たちで作った無料ツール</text>
  <text x="40" y="66" font-size="21" font-weight="800" fill="#1B3A57">婚前契約書を、ふたりでつくる「ふたりも」</text>
  <text x="40" y="92" font-size="13.5" fill="#6E6354">質問にふたりで答えるだけ。ズレが見えて、下書きまでできる。</text>
  <text x="40" y="110" font-size="13.5" fill="#6E6354">登録不要・無料。内容は、この端末から外に出ない。</text>

  <rect x="40" y="124" width="176" height="32" rx="16" fill="#B5481F"/>
  <text x="128" y="145" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">ふたりもをひらく →</text>
</svg>
