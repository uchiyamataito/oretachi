<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 448" role="img" aria-labelledby="tk dk" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="tk">一日と週末で、何回うかがっているか</title>
  <desc id="dk">一日と週のうちで妻の機嫌をうかがっている場面を数える図。朝、起きてきた様子で今日の空気を予想する。出かける前、一言のトーンでその日の連絡の仕方を決める。日中、返信の速さや文面から機嫌を推測する。帰宅前、玄関の音を聞いてからドアを開ける。帰宅後、話しかけるタイミングを計る。夜、寝室に行く時間をずらす。週末、予定を相手の機嫌を見てから決める。これらは相手を読むための作業で、読んでも相手の機嫌は変わらない。数が多いほど悪いのではなく、それだけ長くやってきたというだけ。手放すのは帰宅前に玄関の音を聞くことからが多い。一日一回で、外したときの影響がいちばん小さいからだ。帰宅前の行だけ色を変えているのは、そのため。</desc>

  <rect x="0.5" y="0.5" width="699" height="447" rx="12" fill="#FFFFFF" stroke="#ECE3D5"/>
  <rect x="32" y="24" width="4" height="22" rx="2" fill="#E2703A"/>
  <text x="48" y="42" font-size="19" font-weight="800" fill="#1B3A57">一日と週末で、何回うかがっているか</text>
  <text x="48" y="64" font-size="13" fill="#6E6354">これは責める話ではない。まず数だけ見る</text>

  <line x1="60" y1="100" x2="60" y2="356" stroke="#E4DACB" stroke-width="1.5"/>

  <circle cx="60" cy="112" r="5" fill="#1B3A57"/>
  <text x="84" y="108" font-size="12" font-weight="700" fill="#1B3A57">朝</text>
  <text x="84" y="126" font-size="13" fill="#2C2A26">起きてきた様子で、今日の空気を予想する</text>

  <circle cx="60" cy="152" r="5" fill="#1B3A57"/>
  <text x="84" y="148" font-size="12" font-weight="700" fill="#1B3A57">出かける前</text>
  <text x="84" y="166" font-size="13" fill="#2C2A26">一言のトーンで、その日の連絡の仕方を決める</text>

  <circle cx="60" cy="192" r="5" fill="#1B3A57"/>
  <text x="84" y="188" font-size="12" font-weight="700" fill="#1B3A57">日中</text>
  <text x="84" y="206" font-size="13" fill="#2C2A26">返信の速さや文面から、機嫌を推測する</text>

  <circle cx="60" cy="232" r="5" fill="#E2703A"/>
  <text x="84" y="228" font-size="12" font-weight="700" fill="#E2703A">帰宅前</text>
  <text x="84" y="246" font-size="13" fill="#2C2A26">玄関の音を聞いてから、ドアを開ける</text>

  <circle cx="60" cy="272" r="5" fill="#1B3A57"/>
  <text x="84" y="268" font-size="12" font-weight="700" fill="#1B3A57">帰宅後</text>
  <text x="84" y="286" font-size="13" fill="#2C2A26">話しかけるタイミングを計る</text>

  <circle cx="60" cy="312" r="5" fill="#1B3A57"/>
  <text x="84" y="308" font-size="12" font-weight="700" fill="#1B3A57">夜</text>
  <text x="84" y="326" font-size="13" fill="#2C2A26">寝室に行く時間をずらす</text>

  <circle cx="60" cy="352" r="5" fill="#1B3A57"/>
  <text x="84" y="348" font-size="12" font-weight="700" fill="#1B3A57">週末</text>
  <text x="84" y="366" font-size="13" fill="#2C2A26">予定を、相手の機嫌を見てから決める</text>

  <rect x="32" y="384" width="636" height="52" rx="8" fill="#FBF9F4" stroke="#E4DACB"/>
  <text x="52" y="406" font-size="13" font-weight="700" fill="#1B3A57">多いほど悪い、のではない。それだけ長くやってきた、というだけだ</text>
  <text x="52" y="425" font-size="11.5" fill="#B5481F">手放すのは色のついた「帰宅前」からが多い。一日一回で、外したときの影響がいちばん小さい</text>
</svg>
