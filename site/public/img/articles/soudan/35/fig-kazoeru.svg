<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" role="img" aria-labelledby="tk dk" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="tk">一日のうち、何回うかがっているか</title>
  <desc id="dk">一日のうちで妻の機嫌をうかがっている場面を時間順に並べた図。朝は起きてきた様子で今日の空気を予想する。出かける前は一言のトーンでその日の連絡の仕方を決める。日中はLINEの返信の速さや文面から機嫌を推測する。帰宅前は玄関の音を聞いてからドアを開ける。帰宅後は話しかけるタイミングを計る。夜は寝室に行く時間をずらす。これらは相手を読むための作業で、読んでも状況は変わらない。数が多いほど悪いのではなく、それだけ長く持ちこたえてきたということ。</desc>

  <rect x="0.5" y="0.5" width="699" height="371" rx="12" fill="#FFFFFF" stroke="#ECE3D5"/>
  <rect x="32" y="24" width="4" height="22" rx="2" fill="#E2703A"/>
  <text x="48" y="42" font-size="19" font-weight="800" fill="#1B3A57">一日のうち、何回うかがっているか</text>
  <text x="48" y="64" font-size="13" fill="#6E6354">これは責める話ではない。まず数だけ見る</text>

  <line x1="60" y1="100" x2="60" y2="292" stroke="#E4DACB" stroke-width="1.5"/>

  <circle cx="60" cy="112" r="5" fill="#1B3A57"/>
  <text x="84" y="108" font-size="12" font-weight="700" fill="#1B3A57">朝</text>
  <text x="84" y="126" font-size="13" fill="#2C2A26">起きてきた様子で、今日の空気を予想する</text>

  <circle cx="60" cy="156" r="5" fill="#1B3A57"/>
  <text x="84" y="152" font-size="12" font-weight="700" fill="#1B3A57">出かける前</text>
  <text x="84" y="170" font-size="13" fill="#2C2A26">一言のトーンで、その日の連絡の仕方を決める</text>

  <circle cx="60" cy="200" r="5" fill="#1B3A57"/>
  <text x="84" y="196" font-size="12" font-weight="700" fill="#1B3A57">日中</text>
  <text x="84" y="214" font-size="13" fill="#2C2A26">返信の速さや文面から、機嫌を推測する</text>

  <circle cx="60" cy="244" r="5" fill="#E2703A"/>
  <text x="84" y="240" font-size="12" font-weight="700" fill="#E2703A">帰宅前</text>
  <text x="84" y="258" font-size="13" fill="#2C2A26">玄関の音を聞いてから、ドアを開ける</text>

  <circle cx="60" cy="288" r="5" fill="#1B3A57"/>
  <text x="84" y="284" font-size="12" font-weight="700" fill="#1B3A57">夜</text>
  <text x="84" y="302" font-size="13" fill="#2C2A26">話しかけるタイミングを計る。寝室に行く時間をずらす</text>

  <rect x="32" y="320" width="636" height="36" rx="8" fill="#FBF9F4" stroke="#E4DACB"/>
  <text x="52" y="343" font-size="13" font-weight="700" fill="#1B3A57">多いほど、あなたが悪いのではない。それだけ長く持ちこたえてきた、というだけだ</text>
</svg>
