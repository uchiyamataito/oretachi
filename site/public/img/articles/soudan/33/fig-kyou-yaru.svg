<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 386" role="img" aria-labelledby="ty2 dy2" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="ty2">終わりを早めるためのチェックリスト</title>
  <desc id="dy2">妻の無視がいつまで続くかを考えるときのチェックリスト。六項目ある。一つ目、いまの沈黙がどの型かを確かめた。二つ目、一ヶ月を超えているなら時間が解決するという構えを捨てた。三つ目、追いかけをいったんやめた。四つ目、短い一言を間隔を空けて置き続けている。五つ目、過去の話が出てきたときに反論しないと決めた。六つ目、動かない場合に備えて事実の記録を残しはじめた。三つ目と四つ目は相手の許可がいらない、と書かれている。</desc>

  <rect x="0.5" y="0.5" width="699" height="385" rx="12" fill="#FFFFFF" stroke="#ECE3D5"/>

  <rect x="32" y="24" width="4" height="22" rx="2" fill="#E2703A"/>
  <text x="48" y="42" font-size="19" font-weight="800" fill="#1B3A57">終わりを早めるために</text>
  <text x="48" y="64" font-size="13" fill="#6E6354">日数は動かせないが、この六つは動かせる</text>

  <rect x="32" y="84" width="636" height="34" rx="8" fill="#FBF9F4"/>
  <rect x="48" y="93" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E7B39F" stroke-width="1.5"/>
  <text x="78" y="106" font-size="13.5" fill="#2C2A26">いまの沈黙が、<tspan font-weight="700">どの型か</tspan>を確かめた</text>

  <rect x="32" y="126" width="636" height="34" rx="8" fill="#FBF9F4"/>
  <rect x="48" y="135" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E7B39F" stroke-width="1.5"/>
  <text x="78" y="148" font-size="13.5" fill="#2C2A26">一ヶ月を超えているなら「<tspan font-weight="700">時間が解決する</tspan>」という構えを捨てた</text>

  <rect x="32" y="168" width="636" height="34" rx="8" fill="#FBF1EA" stroke="#E7B39F" stroke-width="1.5"/>
  <rect x="48" y="177" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#B5481F" stroke-width="1.5"/>
  <text x="78" y="190" font-size="13.5" fill="#2C2A26"><tspan font-weight="800" fill="#B5481F">追いかけを、いったんやめた</tspan></text>

  <rect x="32" y="210" width="636" height="34" rx="8" fill="#FBF1EA" stroke="#E7B39F" stroke-width="1.5"/>
  <rect x="48" y="219" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#B5481F" stroke-width="1.5"/>
  <text x="78" y="232" font-size="13.5" fill="#2C2A26"><tspan font-weight="800" fill="#B5481F">短い一言を、間隔を空けて置き続けている</tspan></text>

  <rect x="32" y="252" width="636" height="34" rx="8" fill="#FBF9F4"/>
  <rect x="48" y="261" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E7B39F" stroke-width="1.5"/>
  <text x="78" y="274" font-size="13.5" fill="#2C2A26"><tspan font-weight="700">過去の話</tspan>が出てきたときに、反論しないと決めた</text>

  <rect x="32" y="294" width="636" height="34" rx="8" fill="#FBF9F4"/>
  <rect x="48" y="303" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E7B39F" stroke-width="1.5"/>
  <text x="78" y="316" font-size="13.5" fill="#2C2A26">動かない場合に備えて、<tspan font-weight="700">事実の記録</tspan>を残しはじめた</text>

  <text x="32" y="360" font-size="13" font-weight="700" fill="#1B3A57">色のついた二つは、相手の許可がいらない。今日から動かせるのはここだ</text>
</svg>
