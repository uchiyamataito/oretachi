<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 596" role="img" aria-labelledby="t14 d14" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="t14">最初の14日でやること</title>
  <desc id="d14">1〜3日目は混乱して眠れない時期。返事を保留する（「少し考えさせてほしい」・約5分）と、言われたことを日付つきで記録する（10分から）。4〜7日目は少し冷静になる時期。住まいと生活費のメドを立てる（約30分）と、お金の棚卸し（30〜60分）。8〜14日目は現実を見始める時期。期限のある手続きを把握する（約15分）と、必要なら専門家に相談する。期限があるのは健康保険だけで、資格喪失日からおおむね14日以内。起算は離婚や扶養を外れた日で、切り出された日から14日ではない。全期間を通して、感情的な連絡と口約束をしないこと、ひとりで溜め込みすぎないこと。</desc>

  <rect x="0.5" y="0.5" width="699" height="595" rx="14" fill="#FFFFFF" stroke="#ECE3D5"/>
  <rect x="36" y="28" width="4" height="22" rx="2" fill="#E2703A"/>
  <text x="52" y="46" font-size="19" font-weight="800" fill="#1B3A57">最初の14日でやること</text>
  <text x="52" y="68" font-size="12.5" fill="#6E6354">配偶者と話すのは①だけ。あとは全部、自分ひとりで終わる</text>

  <!-- 1〜3日目 -->
  <rect x="36" y="88" width="628" height="104" rx="12" fill="#FBF9F4" stroke="#E4DACB"/>
  <rect x="56" y="104" width="120" height="72" rx="8" fill="#1B3A57"/>
  <text x="116" y="132" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">1〜3日目</text>
  <text x="116" y="154" font-size="11" fill="#D5E0EA" text-anchor="middle">混乱・眠れない</text>
  <rect x="192" y="104" width="224" height="72" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="304" y="126" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">① 返事を保留する</text>
  <text x="304" y="146" font-size="12" fill="#1B3A57" text-anchor="middle">「少し考えさせてほしい」</text>
  <text x="304" y="166" font-size="11" font-weight="700" fill="#B5481F" text-anchor="middle">約5分</text>
  <rect x="432" y="104" width="212" height="72" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="538" y="126" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">② 言われたことを</text>
  <text x="538" y="146" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">日付つきで記録</text>
  <text x="538" y="166" font-size="11" font-weight="700" fill="#B5481F" text-anchor="middle">10分〜</text>

  <!-- 4〜7日目 -->
  <rect x="36" y="208" width="628" height="104" rx="12" fill="#FBF9F4" stroke="#E4DACB"/>
  <rect x="56" y="224" width="120" height="72" rx="8" fill="#1B3A57"/>
  <text x="116" y="252" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">4〜7日目</text>
  <text x="116" y="274" font-size="11" fill="#D5E0EA" text-anchor="middle">少し冷静に</text>
  <rect x="192" y="224" width="224" height="72" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="304" y="246" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">③ 住まい・生活費の</text>
  <text x="304" y="266" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">当面のメドを立てる</text>
  <text x="304" y="286" font-size="11" font-weight="700" fill="#B5481F" text-anchor="middle">約30分</text>
  <rect x="432" y="224" width="212" height="72" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="538" y="246" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">④ お金の棚卸し</text>
  <text x="538" y="266" font-size="11" fill="#6E6354" text-anchor="middle">収入・固定費・口座・保険</text>
  <text x="538" y="286" font-size="11" font-weight="700" fill="#B5481F" text-anchor="middle">30〜60分</text>

  <!-- 8〜14日目 -->
  <rect x="36" y="328" width="628" height="104" rx="12" fill="#FBF9F4" stroke="#E4DACB"/>
  <rect x="56" y="344" width="120" height="72" rx="8" fill="#1B3A57"/>
  <text x="116" y="372" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">8〜14日目</text>
  <text x="116" y="394" font-size="11" fill="#D5E0EA" text-anchor="middle">現実を見始める</text>
  <rect x="192" y="344" width="224" height="72" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="304" y="366" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">⑤ 期限のある手続きを</text>
  <text x="304" y="386" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">把握する</text>
  <text x="304" y="406" font-size="11" font-weight="700" fill="#B5481F" text-anchor="middle">把握だけなら約15分</text>
  <rect x="432" y="344" width="212" height="72" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="538" y="366" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">⑥ 必要なら</text>
  <text x="538" y="386" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="middle">専門家に相談</text>
  <text x="538" y="406" font-size="11" fill="#6E6354" text-anchor="middle">無料で使える窓口がある</text>

  <!-- 唯一の期限（タイムラインに架けない） -->
  <rect x="36" y="448" width="628" height="48" rx="8" fill="#FBF1EA" stroke="#E7B39F"/>
  <text x="56" y="470" font-size="12.5" font-weight="800" fill="#B5481F">★ 期限があるのは健康保険だけ。「資格喪失日」からおおむね14日以内</text>
  <text x="56" y="488" font-size="11" fill="#6E6354">起算は離婚や扶養を外れた日。切り出された日から14日、ではない</text>

  <!-- 全期間 -->
  <rect x="36" y="512" width="628" height="68" rx="8" fill="#EFF7F2" stroke="#CBE5D6"/>
  <text x="56" y="534" font-size="12.5" font-weight="700" fill="#0F6E56">全期間を通して：感情的な連絡と、その場の口約束はしない</text>
  <text x="56" y="554" font-size="12.5" font-weight="700" fill="#0F6E56">全期間を通して：ひとりで溜め込みすぎない（つらすぎる時は匿名の窓口へ）</text>
  <text x="56" y="572" font-size="12" fill="#2C2A26">1日ずれても、戻ってもいい。今日、1つやれば十分だ</text>
</svg>
