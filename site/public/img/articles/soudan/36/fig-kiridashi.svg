<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="tk dk" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="tk">婚前契約、そのまま使える切り出しの一言</title>
  <desc id="dk">婚前契約の切り出しの一言を、場面別に3つ並べた図。再婚でなおさら言い出しにくいときは、前の結婚のこともあるし、今度はお金とか将来のこと、先にちゃんと話しておきたいんだ。特にきっかけがないときは、将来のお金のこととか、もしもの時のこと、一回ちゃんと、話す時間つくらない。友達の離婚話やニュースが出たときは、この前、友達の話を聞いてさ、うちも先に決めとこうかな、と思って。どれも共通しているのは、疑いじゃなく将来の話として出す、その場で答えを求めない、相手が断れる形にしておく、の3つ。</desc>

  <rect x="0.5" y="0.5" width="699" height="469" rx="12" fill="#FFFFFF" stroke="#ECE3D5"/>

  <rect x="32" y="24" width="4" height="22" rx="2" fill="#E2703A"/>
  <text x="48" y="42" font-size="19" font-weight="800" fill="#1B3A57">婚前契約、そのまま使える切り出しの一言</text>
  <text x="48" y="64" font-size="13" fill="#6E6354">一言目に「契約」は使わない</text>

  <rect x="32" y="84" width="636" height="86" rx="12" fill="#FBF9F4" stroke="#E4DACB"/>
  <text x="52" y="110" font-size="11.5" font-weight="700" fill="#B5481F">再婚で、なおさら言い出しにくいとき</text>
  <text x="52" y="134" font-size="14" font-weight="700" fill="#2C2A26">「前の結婚のこともあるし、今度はお金とか将来のこと、</text>
  <text x="52" y="154" font-size="14" font-weight="700" fill="#2C2A26">　先にちゃんと話しておきたいんだ。」</text>

  <rect x="32" y="180" width="636" height="86" rx="12" fill="#FBF9F4" stroke="#E4DACB"/>
  <text x="52" y="206" font-size="11.5" font-weight="700" fill="#0F6E56">特にきっかけがないとき</text>
  <text x="52" y="230" font-size="14" font-weight="700" fill="#2C2A26">「将来のお金のこととか、もしもの時のこと。</text>
  <text x="52" y="250" font-size="14" font-weight="700" fill="#2C2A26">　一回ちゃんと、話す時間つくらない？」</text>

  <rect x="32" y="276" width="636" height="86" rx="12" fill="#FBF9F4" stroke="#E4DACB"/>
  <text x="52" y="302" font-size="11.5" font-weight="700" fill="#1B3A57">友達の離婚話やニュースが出たとき</text>
  <text x="52" y="326" font-size="14" font-weight="700" fill="#2C2A26">「この前、〔友達〕の話を聞いてさ。</text>
  <text x="52" y="346" font-size="14" font-weight="700" fill="#2C2A26">　うちも先に決めとこうかな、と思って。」</text>

  <rect x="32" y="382" width="636" height="64" rx="8" fill="#FBF9F4" stroke="#E4DACB"/>
  <text x="52" y="406" font-size="13" font-weight="700" fill="#1B3A57">どれも共通しているのは3つ。疑いじゃなく、将来の話として出す。</text>
  <text x="52" y="426" font-size="13" font-weight="700" fill="#1B3A57">その場で答えを求めない。相手が断れる形にしておく。</text>
</svg>
