<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 496" role="img" aria-labelledby="t2 d2" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="t2">いま危ないか、繰り返し起きているか、どちらでもないか。この順番で見る</title>
  <desc id="d2">殴られている、首を絞められた、凶器を出された、殺すと言われた、外に出してもらえない、子どもに手が出た、のどれかなら1回目でも110番。繰り返しかどうかは関係ない。今すぐ危なくはないが、なぐる、どなる、無視する、生活費を渡さない、なぐるそぶりでおどす、といったことが起きているならDV相談プラス0120-279-889や#8008へ。子どものことなら189。どちらでもないなら4段階のどこにいるかを見る。</desc>

  <rect x="0.5" y="0.5" width="699" height="495" rx="14" fill="#FFFFFF" stroke="#ECE3D5"/>
  <rect x="36" y="28" width="4" height="22" rx="2" fill="#E2703A"/>
  <text x="52" y="46" font-size="19" font-weight="800" fill="#1B3A57">この順番で見る</text>
  <text x="52" y="68" font-size="12.5" fill="#6E6354">同じ「怖い」でも、いま危ないのか、続いているのかで打つ手が変わる</text>

  <!-- ① いま危ない -->
  <rect x="36" y="88" width="624" height="140" rx="12" fill="#FBF1EA" stroke="#E7B39F"/>
  <text x="56" y="114" font-size="14" font-weight="800" fill="#B5481F">① いま危ないか</text>
  <rect x="56" y="126" width="188" height="32" rx="8" fill="#FFFFFF" stroke="#E7B39F"/>
  <text x="150" y="147" font-size="12" fill="#2C2A26" text-anchor="middle">殴られている</text>
  <rect x="256" y="126" width="188" height="32" rx="8" fill="#FFFFFF" stroke="#E7B39F"/>
  <text x="350" y="147" font-size="12" fill="#2C2A26" text-anchor="middle">首を絞められた</text>
  <rect x="456" y="126" width="184" height="32" rx="8" fill="#FFFFFF" stroke="#E7B39F"/>
  <text x="548" y="147" font-size="12" fill="#2C2A26" text-anchor="middle">凶器を出された</text>
  <rect x="56" y="166" width="188" height="32" rx="8" fill="#FFFFFF" stroke="#E7B39F"/>
  <text x="150" y="187" font-size="12" fill="#2C2A26" text-anchor="middle">「殺す」と言われた</text>
  <rect x="256" y="166" width="188" height="32" rx="8" fill="#FFFFFF" stroke="#E7B39F"/>
  <text x="350" y="187" font-size="12" fill="#2C2A26" text-anchor="middle">外に出してもらえない</text>
  <rect x="456" y="166" width="184" height="32" rx="8" fill="#FFFFFF" stroke="#E7B39F"/>
  <text x="548" y="187" font-size="12" fill="#2C2A26" text-anchor="middle">子どもに手が出た</text>
  <text x="56" y="216" font-size="13.5" font-weight="800" fill="#B5481F">→ 1回目でも110番。繰り返しかどうかは関係ない</text>

  <!-- ② 繰り返し起きている -->
  <rect x="36" y="244" width="624" height="140" rx="12" fill="#FBF9F4" stroke="#E4DACB"/>
  <text x="56" y="270" font-size="14" font-weight="800" fill="#1B3A57">② いまは危なくないが、これが起きているか</text>
  <text x="56" y="288" font-size="11.5" fill="#6E6354">内閣府が「暴力の形態」の例として挙げているもの（これで全部ではない）</text>
  <rect x="56" y="298" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="126" y="316" font-size="11.5" font-weight="700" fill="#1B3A57" text-anchor="middle">身体的</text>
  <text x="126" y="334" font-size="11" fill="#6E6354" text-anchor="middle">なぐる・物を投げる</text>
  <rect x="208" y="298" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="278" y="316" font-size="11.5" font-weight="700" fill="#1B3A57" text-anchor="middle">精神的</text>
  <text x="278" y="334" font-size="11" fill="#6E6354" text-anchor="middle">どなる・無視する</text>
  <rect x="360" y="298" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="430" y="316" font-size="11.5" font-weight="700" fill="#1B3A57" text-anchor="middle">性的</text>
  <text x="430" y="334" font-size="11" fill="#6E6354" text-anchor="middle">いやがるのに強要</text>
  <rect x="512" y="298" width="128" height="46" rx="8" fill="#FFFFFF" stroke="#ECE3D5"/>
  <text x="576" y="316" font-size="11.5" font-weight="700" fill="#1B3A57" text-anchor="middle">おどし</text>
  <text x="576" y="334" font-size="11" fill="#6E6354" text-anchor="middle">なぐるそぶり</text>
  <text x="56" y="368" font-size="12.5" font-weight="700" fill="#1B3A57">→ DV相談プラス 0120-279-889（電話24時間・無料）／子どものことなら 189</text>

  <!-- ③ どちらでもない -->
  <rect x="36" y="400" width="624" height="64" rx="12" fill="#EFF7F2" stroke="#CBE5D6"/>
  <text x="56" y="426" font-size="14" font-weight="800" fill="#0F6E56">③ どちらでもないなら</text>
  <text x="56" y="448" font-size="12.5" fill="#2C2A26">→ 下の4段階で、いま自分がどこにいるかを見る</text>

  <text x="52" y="484" font-size="11" fill="#8C8270">※これは「あなたがDVを受けている」と判定するものではない。窓口につながる順番の目安。</text>
</svg>
