<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 464" role="img" aria-labelledby="tk dk" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <title id="tk">自分がどのケースかで、健康保険の手続きと期限が変わる</title>
  <desc id="dk">ケースAは会社員のまま社保本人で、自分の保険は変わらず、配偶者と子を扶養から外す手続きを勤め先に早めに出す。ケースBは配偶者の扶養に入っていた場合で、扶養から外れるため国保などに入り直す。期限は資格喪失日からおおむね14日以内。ケースCは離婚を機に退職する場合で、社保を失うため国保か任意継続を選ぶ。国保はおおむね14日以内、任意継続は20日以内。14日と20日を混同しない。これは自分自身の保険の図で、妻や子の保険は別の章で扱う。</desc>

  <rect x="0.5" y="0.5" width="699" height="463" rx="14" fill="#FFFFFF" stroke="#ECE3D5"/>
  <rect x="36" y="28" width="4" height="22" rx="2" fill="#E2703A"/>
  <text x="52" y="46" font-size="19" font-weight="800" fill="#1B3A57">自分がどのケースかで、期限が変わる</text>
  <text x="52" y="68" font-size="12.5" fill="#6E6354">先に自分のケースを決めてから、期限を見る</text>

  <!-- 起点の問い -->
  <rect x="36" y="88" width="628" height="40" rx="8" fill="#F4F7FA" stroke="#D5E0EA"/>
  <text x="56" y="113" font-size="13.5" font-weight="700" fill="#1B3A57">いま、あなた自身はどの健康保険に入っている？</text>

  <!-- ケースA -->
  <rect x="36" y="144" width="196" height="216" rx="14" fill="#FBF9F4" stroke="#E4DACB"/>
  <path d="M36 184 V158 Q36 144 50 144 H218 Q232 144 232 158 V184 Z" fill="#1B3A57"/>
  <text x="134" y="170" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">A 会社員（社保本人）</text>
  <text x="134" y="208" font-size="11" fill="#8C8270" text-anchor="middle">自分の保険は</text>
  <text x="134" y="230" font-size="14" font-weight="700" fill="#0F6E56" text-anchor="middle">変わらない</text>
  <line x1="60" y1="246" x2="208" y2="246" stroke="#ECE3D5"/>
  <text x="134" y="266" font-size="11" fill="#8C8270" text-anchor="middle">やること</text>
  <text x="134" y="288" font-size="13" fill="#2C2A26" text-anchor="middle">配偶者と子を</text>
  <text x="134" y="306" font-size="13" fill="#2C2A26" text-anchor="middle">扶養から外す</text>
  <rect x="56" y="318" width="156" height="30" rx="8" fill="#F4F7FA" stroke="#D5E0EA"/>
  <text x="134" y="338" font-size="12" font-weight="700" fill="#1B3A57" text-anchor="middle">勤め先に早めに</text>

  <!-- ケースB -->
  <rect x="252" y="144" width="196" height="216" rx="14" fill="#FBF9F4" stroke="#E7B39F"/>
  <path d="M252 184 V158 Q252 144 266 144 H434 Q448 144 448 158 V184 Z" fill="#1B3A57"/>
  <text x="350" y="170" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">B 配偶者の扶養だった</text>
  <text x="350" y="208" font-size="11" fill="#8C8270" text-anchor="middle">自分の保険は</text>
  <text x="350" y="230" font-size="14" font-weight="700" fill="#B5481F" text-anchor="middle">扶養から外れる</text>
  <line x1="276" y1="246" x2="424" y2="246" stroke="#ECE3D5"/>
  <text x="350" y="266" font-size="11" fill="#8C8270" text-anchor="middle">やること</text>
  <text x="350" y="288" font-size="13" fill="#2C2A26" text-anchor="middle">国保などに</text>
  <text x="350" y="306" font-size="13" fill="#2C2A26" text-anchor="middle">入り直す</text>
  <rect x="272" y="318" width="156" height="30" rx="8" fill="#FBF1EA" stroke="#E7B39F"/>
  <text x="350" y="338" font-size="13" font-weight="800" fill="#B5481F" text-anchor="middle">おおむね14日以内</text>

  <!-- ケースC -->
  <rect x="468" y="144" width="196" height="216" rx="14" fill="#FBF9F4" stroke="#E7B39F"/>
  <path d="M468 184 V158 Q468 144 482 144 H650 Q664 144 664 158 V184 Z" fill="#B5481F"/>
  <text x="566" y="170" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">C 退職する・した</text>
  <text x="566" y="208" font-size="11" fill="#8C8270" text-anchor="middle">自分の保険は</text>
  <text x="566" y="230" font-size="14" font-weight="700" fill="#B5481F" text-anchor="middle">社保を失う</text>
  <line x1="492" y1="246" x2="640" y2="246" stroke="#ECE3D5"/>
  <text x="566" y="266" font-size="11" fill="#8C8270" text-anchor="middle">やること</text>
  <text x="566" y="288" font-size="13" fill="#2C2A26" text-anchor="middle">国保か任意継続、</text>
  <text x="566" y="306" font-size="13" fill="#2C2A26" text-anchor="middle">どちらかを選ぶ</text>
  <rect x="488" y="318" width="156" height="30" rx="8" fill="#FBF1EA" stroke="#E7B39F"/>
  <text x="566" y="332" font-size="11.5" font-weight="800" fill="#B5481F" text-anchor="middle">国保 おおむね14日以内</text>
  <text x="566" y="345" font-size="11.5" font-weight="800" fill="#B5481F" text-anchor="middle">任意継続 20日以内</text>

  <!-- 帯 -->
  <rect x="36" y="376" width="628" height="40" rx="8" fill="#FBF1EA" stroke="#E7B39F"/>
  <text x="56" y="401" font-size="13" font-weight="700" fill="#B5481F">14日と20日を、混ぜない。BとCは、選ぶ先で期限が変わる</text>

  <text x="52" y="440" font-size="11" fill="#8C8270">※これは「あなた自身」の保険の図。扶養に入れていた妻・子の保険は、別の章で扱う。</text>
</svg>
